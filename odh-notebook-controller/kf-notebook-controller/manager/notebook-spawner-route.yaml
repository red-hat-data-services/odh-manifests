apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    app: notebook-spawner
  name: notebook-spawner
  namespace: redhat-ods-applications
spec:
  port:
    targetPort: 8080
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: Reencrypt
  to:
    kind: Service
    name: notebook-controller
  wildcardPolicy: None
